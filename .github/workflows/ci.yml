name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # No secrets in CI: the placeholder defines from .env.example are enough to build.
      DEFINES: --dart-define-from-file=.env.example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign $DEFINES

      - name: Build macOS
        run: flutter build macos $DEFINES
